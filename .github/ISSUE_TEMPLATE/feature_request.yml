name: "Feature Request"
description: "Suggest an improvement, new CLI option, or new dataset column."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting an enhancement helps make the CCU Evidence Engine more comprehensive and useful.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific limitation or workflow challenge?
      placeholder: "A clear and concise description of what you are trying to accomplish."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Implementation
      description: Describe your proposed solution or feature addition.
      placeholder: "Describe the new script, option, or dataset schema enhancement."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Have you considered any alternative workarounds or solutions?
    validations:
      required: false
