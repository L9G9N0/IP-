name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -v --durations=10

      - name: Validate RFC 4180 CSV Integrity
        run: |
          python -c "
          import csv, glob, sys
          failed = False
          for path in sorted(glob.glob('research/**/*.csv', recursive=True)):
              with open(path, 'r', encoding='utf-8') as f:
                  reader = list(csv.reader(f))
                  if not reader:
                      print(f'[FAIL] Empty CSV: {path}')
                      failed = True
                      continue
                  expected_cols = len(reader[0])
                  for idx, row in enumerate(reader[1:], start=2):
                      if len(row) != expected_cols:
                          print(f'[FAIL] Column mismatch in {path} line {idx}: expected {expected_cols}, got {len(row)}')
                          failed = True
                  print(f'[PASS] {path}: {len(reader)-1} rows, {expected_cols} cols')
          if failed:
              sys.exit(1)
          "
